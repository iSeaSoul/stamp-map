<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国立公園乃印マップ | National Park Stamp Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --forest:#1B3A2E;
    --forest-dark:#122822;
    --parchment:#F3EDDD;
    --paper:#FBF8EF;
    --ink:#2A2621;
    --ink-soft:#5B564C;
    --vermillion:#B23A2E;
    --moss:#5C7A5E;
    --gold:#C89B3C;
    --line: rgba(42,38,33,.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans JP', sans-serif;
    background:var(--parchment);
    color:var(--ink);
  }
  .brand{font-family:'Shippori Mincho', serif;}

  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    background:var(--forest);
    color:var(--parchment);
    padding:14px 20px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--gold);
  }
  header h1{
    font-size:1.25rem;
    margin:0;
    font-weight:700;
    letter-spacing:.02em;
  }
  header .en{
    font-size:.78rem;
    color:#CFE0D3;
    font-weight:400;
  }
  header .count{
    margin-left:auto;
    font-size:.82rem;
    color:#EADFC3;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header .count b{ color:#fff; font-size:1rem; }

  .layout{ flex:1; display:flex; min-height:0; }

  #sidebar{
    width:400px;
    min-width:320px;
    background:var(--paper);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #map{ flex:1; background:#dfe7e1; }

  .sidebar-controls{ padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  #search{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:inherit;
    font-size:.92rem;
    background:#fff;
  }
  #search:focus{ outline:2px solid var(--moss); outline-offset:1px; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{
    font-size:.76rem;
    padding:5px 10px;
    border:1px solid var(--moss);
    color:var(--moss);
    background:transparent;
    border-radius:3px;
    cursor:pointer;
    font-family:inherit;
  }
  .chip.active{ background:var(--moss); color:#fff; }

  .progress-wrap{
    padding:8px 16px;
    font-size:.74rem;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    display:none;
  }
  .progress-wrap.show{ display:block; }
  .progress-bar{ height:4px; background:var(--line); border-radius:2px; margin-top:5px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gold); width:0%; transition:width .3s; }

  #list{ flex:1; overflow-y:auto; padding:6px 0 40px; }
  .park-group{ border-bottom:1px solid var(--line); }
  .park-head{
    padding:10px 16px 8px;
    position:sticky; top:0;
    background:var(--paper);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .park-head-text{ flex:1; min-width:0; }
  .park-head .jp{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:.95rem; }
  .park-head .en{ font-size:.72rem; color:var(--ink-soft); }
  .park-stamp-btn{
    flex:none;
    width:30px; height:30px;
    border-radius:50%;
    border:2px solid var(--moss);
    background:transparent;
    cursor:pointer;
    color:transparent;
    font-size:.75rem;
    font-family:'Shippori Mincho',serif;
    line-height:1;
  }
  .park-stamp-btn.on{
    background:var(--vermillion);
    border-color:var(--vermillion);
    color:#fff;
  }

  .facility{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 16px 8px 20px;
    cursor:pointer;
    border-top:1px solid rgba(0,0,0,.03);
  }
  .facility:hover{ background:#EFE7D2; }
  .facility .fac-dot{
    flex:none;
    width:10px; height:10px;
    border-radius:50%;
    margin-top:6px;
    background:var(--forest);
    opacity:.35;
  }
  .facility .fac-dot.on{
    background:var(--vermillion);
    opacity:1;
  }
  .facility .fac-text{ flex:1; min-width:0; }
  .facility .fac-en{ font-size:.86rem; font-weight:500; }
  .facility .fac-jp{ font-size:.76rem; color:var(--ink-soft); }
  .facility .fac-note{ font-size:.7rem; color:var(--vermillion); margin-top:2px; }
  .facility .fac-pending{ font-size:.68rem; color:var(--ink-soft); font-style:italic; }

  .empty-msg{ padding:24px 16px; color:var(--ink-soft); font-size:.85rem; }

  .leaflet-popup-content{ font-family:'Noto Sans JP',sans-serif; font-size:.85rem; min-width:200px; }
  .popup-en{ font-weight:700; margin-bottom:2px; }
  .popup-jp{ color:var(--ink-soft); font-size:.78rem; margin-bottom:4px; }
  .popup-park{ font-size:.72rem; color:var(--moss); font-family:'Shippori Mincho',serif; margin-bottom:6px; }
  .popup-addr{ font-size:.76rem; margin-bottom:4px; }
  .popup-link{ font-size:.76rem; }
  .popup-note{ font-size:.72rem; color:var(--vermillion); margin-top:4px; }
  .popup-stamp{
    margin-top:8px;
    padding:5px 10px;
    border:1px solid var(--vermillion);
    background:#fff;
    color:var(--vermillion);
    border-radius:3px;
    cursor:pointer;
    font-size:.76rem;
    font-family:inherit;
  }
  .popup-stamp.on{ background:var(--vermillion); color:#fff; }

  .cluster-icon{
    background:var(--forest);
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    border:2px solid var(--paper);
  }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    #sidebar{ width:100%; height:46%; border-right:none; border-bottom:1px solid var(--line); }
    #map{ height:54%; }
  }
</style>
</head>

  <header>
    <h1 class="brand">日本の国立公園乃印マップ</h1>

    <aside id="sidebar">
      <div class="sidebar-controls">

        <div class="chips" id="regionChips"></div>
      </div>
      <div id="list"></div>
    </aside>
    <main id="map"></main>
  </div>
</div>

const FACILITIES = [];
PARKS.forEach(park => {
  park.facilities.forEach((f, i) => {
    FACILITIES.push({
      fid: 'p' + park.id + '-f' + i,
      parkId: park.id,
      parkJp: park.jp,
      parkEn: park.en,
      regions: park.regions,
      jp: f.jp, en: f.en, addr: f.addr, url: f.url || '', note: f.note || ''
    });
  });
});
document.getElementById('totalCount').textContent = PARKS.length;

/* ---------------------------------------------------------------
   Persistent storage helpers (window.storage, best-effort)
--------------------------------------------------------------- */
const hasStorage = typeof window.storage !== 'undefined';
async function safeGet(key, shared){ try { return await window.storage.get(key, shared); } catch(e){ return null; } }
async function safeSet(key, value, shared){ try { return await window.storage.set(key, value, shared); } catch(e){ return null; } }

let visitedSet = new Set();

/* ---------------------------------------------------------------
   Map setup
--------------------------------------------------------------- */
const map = L.map('map', { zoomControl:true }).setView([37.5, 138.0], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18
}).addTo(map);

const clusterGroup = L.markerClusterGroup({
  iconCreateFunction: function(cluster){
    const count = cluster.getChildCount();
    return L.divIcon({
      html: '<div class="cluster-icon" style="width:'+(34+Math.min(count,20))+'px;height:'+(34+Math.min(count,20))+'px;">'+count+'</div>',
      className: '', iconSize: [34,34]
    });
  }
});
map.addLayer(clusterGroup);

const markerByFid = {};

function stampIcon(visited){
  return L.divIcon({
    className:'',
    html: '<div style="width:22px;height:22px;border-radius:50%;background:'+(visited?'#B23A2E':'#1B3A2E')+';border:2px solid #FBF8EF;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>',
    iconSize:[22,22], iconAnchor:[11,11]
  });
}

function addMarker(fac, lat, lng){
  if (markerByFid[fac.fid]) return markerByFid[fac.fid];
  const marker = L.marker([lat,lng], { icon: stampIcon(visitedSet.has(fac.parkId)) });
  marker.bindPopup(buildPopupHtml(fac));
  marker.on('popupopen', () => wirePopupButton(fac));
  clusterGroup.addLayer(marker);
  markerByFid[fac.fid] = marker;
  return marker;
}

function buildPopupHtml(fac){
  const stamped = visitedSet.has(fac.parkId);
  return `
    <div class="popup-en">${fac.en}</div>
    <div class="popup-jp">${fac.jp}</div>
    <div class="popup-park">${fac.parkEn} / ${fac.parkJp}</div>
    <div class="popup-addr">${fac.addr}</div>
    ${fac.url ? `<div class="popup-link"><a href="${fac.url}" target="_blank" rel="noopener">Official site ↗</a></div>` : ''}
    ${fac.note ? `<div class="popup-note">${fac.note}</div>` : ''}
    <button class="popup-stamp ${stamped?'on':''}" data-park="${fac.parkId}">
      ${stamped ? '印 Park stamped' : 'Mark park as stamped'}
    </button>
  `;
}

function wirePopupButton(fac){
  const btn = document.querySelector('.popup-stamp[data-park="'+fac.parkId+'"]');
  if (btn) btn.addEventListener('click', () => toggleVisited(fac.parkId));
}

/* ---------------------------------------------------------------
   Visited tracking (personal, non-shared storage)
--------------------------------------------------------------- */
async function loadVisited(){
  if (!hasStorage) return;
  const res = await safeGet('visited', false);
  if (res && res.value) {
    try { visitedSet = new Set(JSON.parse(res.value)); } catch(e){}
  }
  updateVisitedCount();
}
async function saveVisited(){
  if (!hasStorage) return;
  await safeSet('visited', JSON.stringify([...visitedSet]), false);
}
function updateVisitedCount(){
  document.getElementById('visitedCount').textContent = visitedSet.size;
}
function toggleVisited(parkId){
  if (visitedSet.has(parkId)) visitedSet.delete(parkId); else visitedSet.add(parkId);
  updateVisitedCount();
  saveVisited();
  const stamped = visitedSet.has(parkId);
  FACILITIES.filter(f => f.parkId === parkId).forEach(fac => {
    const marker = markerByFid[fac.fid];
    if (marker) {
      marker.setIcon(stampIcon(stamped));
      marker.setPopupContent(buildPopupHtml(fac));
    }
  });
  renderList();
}

/* ---------------------------------------------------------------
   Placement — every facility's coordinates are already known (COORDS),
   so all markers go on the map in one pass, no network calls needed.
--------------------------------------------------------------- */
function placeAllMarkers(){
  FACILITIES.forEach(fac => {
    const c = COORDS[fac.fid];
    if (c) addMarker(fac, c[0], c[1]);
  });
}

/* ---------------------------------------------------------------
   Sidebar: region chips, search, list
--------------------------------------------------------------- */
let activeRegions = new Set(Object.keys(REGIONS));
let searchTerm = '';

function buildChips(){
  const wrap = document.getElementById('regionChips');
  wrap.innerHTML = '';
  Object.entries(REGIONS).forEach(([key,label]) => {
    const chip = document.createElement('button');
    chip.className = 'chip active';
    chip.textContent = label.split(' ')[0];
    chip.title = label;
    chip.addEventListener('click', () => {
      if (activeRegions.has(key)) activeRegions.delete(key); else activeRegions.add(key);
      chip.classList.toggle('active');
      renderList();
    });
    wrap.appendChild(chip);
  });
}

function matchesFilter(fac){
  const regionOk = fac.regions.some(r => activeRegions.has(r));
  if (!regionOk) return false;
  if (!searchTerm) return true;
  const hay = (fac.en+' '+fac.jp+' '+fac.addr+' '+fac.parkEn+' '+fac.parkJp).toLowerCase();
  return hay.includes(searchTerm);
}

function renderList(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  let shown = 0;

  PARKS.forEach(park => {
    const matches = FACILITIES.filter(f => f.parkId === park.id && matchesFilter(f));
    if (!matches.length) return;
    shown += matches.length;

    const stamped = visitedSet.has(park.id);
    const group = document.createElement('div');
    group.className = 'park-group';
    group.innerHTML = `
      <div class="park-head">
        <button class="park-stamp-btn ${stamped?'on':''}" title="Mark park as stamped" data-park="${park.id}">${stamped?'印':''}</button>
        <div class="park-head-text">
          <div class="jp">${park.jp}</div>
          <div class="en">${park.en}</div>
        </div>
      </div>
    `;
    group.querySelector('.park-stamp-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleVisited(park.id);
    });

    matches.forEach(fac => {
      const row = document.createElement('div');
      row.className = 'facility';
      row.innerHTML = `
        <span class="fac-dot ${stamped?'on':''}"></span>
        <div class="fac-text">
          <div class="fac-en">${fac.en}</div>
          <div class="fac-jp">${fac.jp}</div>
          ${fac.note ? `<div class="fac-note">${fac.note}</div>` : ''}
        </div>
      `;
      row.addEventListener('click', () => {
        const marker = markerByFid[fac.fid];
        if (marker){
          map.flyTo(marker.getLatLng(), 13, { duration: 0.6 });
          clusterGroup.zoomToShowLayer(marker, () => marker.openPopup());
        }
      });
      group.appendChild(row);
    });
    listEl.appendChild(group);
  });

  if (!shown){
    listEl.innerHTML = '<div class="empty-msg">該当する設置箇所が見つかりません。<br>No facilities match your search/filters.</div>';
  }
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderList();
});

/* ---------------------------------------------------------------
   Init
--------------------------------------------------------------- */
(async function init(){
  buildChips();
  await loadVisited();
  placeAllMarkers();
  renderList();
})();
</script>
